# Every secret now comes from .env with no fallback, so a missing value fails
# loudly instead of silently deploying the example password and JWT key.

services:
  postgres:
    image: postgres:16-alpine
    container_name: gms-postgres
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - gms-network
    # Loopback-only - lets `go run cmd/admin/main.go ...` reach the DB from
    # this host (DB_HOST=localhost, DB_PORT=15432) for admin/technician
    # management. Never reachable from outside this machine; not the app's
    # traffic path. Not 5432 - a separate native Postgres already owns that
    # port on this host.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"

  # One-shot job: applies pending migrations, then exits. The API waits for it
  # so the schema is always current before the first request lands.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: gms-migrate
    command: ["/app/migrate", "-cmd=up"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL_MODE: disable
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - gms-network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: gms-backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: 8080
      APP_NAME: ${APP_NAME:-Guarantee Management System}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL_MODE: disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24}
      UPLOAD_PATH: /app/uploads
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - gms-network
    # Not published to the host: nginx is the only entry point. Uncomment to
    # hit the API directly while debugging.
    # ports:
    #   - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: gms-frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - gms-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  gms-network:
    driver: bridge
